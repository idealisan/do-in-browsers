<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abstract Avatar · 色块头像</title>
  <style>
    :root {
      --bg: #101014;
      --panel: #1a1a21;
      --border: #2b2b35;
      --text: #eaeaea;
      --muted: #9a9aa6;
      --accent: #7c6cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px;
      background: var(--bg); color: var(--text);
      font-family: system-ui, "Segoe UI", sans-serif;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .layout {
      display: grid; grid-template-columns: 300px 1fr;
      gap: 20px; max-width: 1200px; margin: 0 auto;
    }
    .panel {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px;
    }
    #drop {
      border: 2px dashed var(--border); border-radius: 10px;
      padding: 28px 12px; text-align: center; color: var(--muted);
      cursor: pointer; transition: border-color .2s;
    }
    #drop.drag { border-color: var(--accent); color: var(--accent); }
    #drop input { display: none; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 16px 0 4px; }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    .val { float: right; color: var(--text); font-variant-numeric: tabular-nums; }
    .preview {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    }
    .preview figure { margin: 0; }
    .preview figcaption { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .preview canvas {
      width: 100%; height: auto; background: repeating-conic-gradient(#222 0 25%, #2c2c33 0 50%) 0 0/16px 16px;
      border-radius: 8px; border: 1px solid var(--border);
    }
    button {
      margin-top: 16px; width: 100%; padding: 12px;
      background: var(--accent); color: #fff; border: 0; border-radius: 10px;
      font-size: 14px; cursor: pointer;
    }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .swatch {
      width: 26px; height: 26px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,.2);
      box-shadow: 0 2px 6px rgba(0,0,0,.4);
    }
    .muted { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <h1>Abstract Avatar · 色块头像</h1>
  <div class="sub">直方图峰值取色 → 邻近像素替换为峰值色块</div>

  <div class="layout">
    <div class="panel">
      <div id="drop">
        <div>拖入图片 或 点击选择</div>
        <input type="file" id="file" accept="image/*">
      </div>

      <label>色块数量 <span class="val" id="vColors">8</span></label>
      <input type="range" id="sColors" min="2" max="24" value="8">

      <label>峰值最小间距 <span class="val" id="vDist">40</span></label>
      <input type="range" id="sDist" min="0" max="120" value="40">

      <button id="download" disabled>下载 PNG</button>
      <div class="muted" id="info"></div>
      <div class="swatches" id="swatches"></div>
    </div>

    <div class="preview">
      <figure>
        <figcaption>原图</figcaption>
        <canvas id="in"></canvas>
      </figure>
      <figure>
        <figcaption>色块图</figcaption>
        <canvas id="out"></canvas>
      </figure>
    </div>
  </div>

  <script src="algorithm.js"></script>
  <script src="app.js"></script>
</body>
</html>
