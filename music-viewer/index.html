<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>Music Viewer · 音乐可视播放器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='4' y='4' width='92' height='92' rx='10' fill='%2313131b'/><text x='50' y='66' font-size='54' text-anchor='middle' fill='%237c6bff'>♪</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <section id="setupView" class="view active">
    <canvas id="auroraSetup" class="aurora" aria-hidden="true"></canvas>

    <div class="view-body">
      <header class="view-header">
        <p class="crumb"><a href="../index.html">← 返回工具集</a></p>
        <h1>Music Viewer</h1>
      </header>

      <form id="setupForm" class="setup-form" novalidate>
        <label class="field required">
          <span class="field-label">标题 · title</span>
          <input id="titleInput" type="text" placeholder="歌名 / 视频标题" autocomplete="off" spellcheck="false">
        </label>
        <label class="field required">
          <span class="field-label">歌手 · artist</span>
          <input id="artistInput" type="text" placeholder="歌手 / 艺术家" autocomplete="off" spellcheck="false">
        </label>

        <div class="upload-row">
          <button type="button" id="coverBtn" class="dropzone cover-zone">
            <span class="cover-thumb">
              <img id="coverPreview" alt="">
              <span class="cover-note">♪</span>
            </span>
            <span class="dz-hint">上传图片 · 封面</span>
          </button>

          <div class="side-uploads">
            <div class="upload-item">
              <span class="file-label">点击上传 .lrc 歌词文件</span>
              <button type="button" id="lrcBtn" class="dropzone file-box">
                <span id="lrcLabel" class="dz-hint">未选择文件</span>
              </button>
            </div>
            <div class="upload-item">
              <span class="file-label">点击上传音乐文件</span>
              <button type="button" id="audioBtn" class="dropzone file-box">
                <span id="audioLabel" class="dz-hint">未选择文件</span>
              </button>
            </div>
          </div>
        </div>

        <div class="actions">
          <button type="submit" id="startBtn" class="primary" disabled>
            开始播放 <span class="arr">→</span>
          </button>
          <p class="hint-line">进入播放页后，点击任意处即可 播放 / 暂停</p>
        </div>
      </form>
    </div>

    <input type="file" id="fileCover" accept="image/*" hidden>
    <input type="file" id="fileAudio" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.oga,.opus,.flac" hidden>
    <input type="file" id="fileLrc" accept=".lrc,.txt,text/plain" hidden>
  </section>

  <section id="playerView" class="view">
    <canvas id="auroraCanvas" class="aurora" aria-hidden="true"></canvas>

    <div class="player">
      <div class="player-main">
        <div class="art-stack">
          <div class="cover-frame" id="coverFrame">
            <img id="coverImg" alt="album cover">
            <span class="cf-note">♪</span>
          </div>
          <div class="meta">
            <h2 id="displayTitle">歌曲标题</h2>
            <p id="displayArtist">歌手</p>
          </div>
        </div>

        <div class="lyrics-wrap">
          <div class="lyrics-scroller" id="lyricsScroller"></div>
        </div>
      </div>
    </div>
  </section>

  <audio id="audioEl" preload="metadata"></audio>

  <script src="app.js"></script>
</body>
</html>
