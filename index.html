<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>do-in-browsers · 纯前端工具集合</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
<style>
  :root {
    --bg-1: #05060f;
    --bg-2: #101227;
    --text: #e8ecff;
    --text-dim: #a5add8;
    --accent: #7c6bff;
    --accent-2: #34e0c8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, var(--bg-1), var(--bg-2), var(--bg-1));
    background-size: 200% 200%;
    animation: bgDrift 18s ease-in-out infinite;
    overflow-x: hidden;
  }
  @keyframes bgDrift {
    0%, 100% { background-position: 0% 0%; }
    50% { background-position: 100% 100%; }
  }
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .45;
    z-index: 0;
    pointer-events: none;
  }
  .blob-1 { width: 46vw; height: 46vw; left: -12vw; top: -14vw;
            background: radial-gradient(circle, #4b3dff, transparent 65%);
            animation: drift1 22s ease-in-out infinite; }
  .blob-2 { width: 42vw; height: 42vw; right: -14vw; bottom: -12vw;
            background: radial-gradient(circle, #1fc9b0, transparent 65%);
            animation: drift2 26s ease-in-out infinite; }
  @keyframes drift1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(6vw, 4vh) scale(1.15); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-5vw, -5vh) scale(1.1); }
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: clamp(2.5rem, 8vh, 6rem) clamp(1.25rem, 5vw, 3rem) 4rem;
  }
  .logo { font-size: 3.2rem; font-weight: 800; letter-spacing: .5px;
          background: linear-gradient(90deg, var(--accent), var(--accent-2));
          -webkit-background-clip: text; background-clip: text;
          -webkit-text-fill-color: transparent; }
  .tagline { margin-top: .5rem; color: var(--text-dim); font-size: 1.05rem; }
  .tagline b { color: var(--text); font-weight: 600; }

  .section-title {
    margin: clamp(2.4rem, 6vh, 4rem) 0 1.2rem;
    font-size: 1.1rem;
    color: var(--text-dim);
    display: flex; align-items: center; gap: .6rem;
  }
  .section-title::after { content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, rgba(124,107,255,.5), transparent); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.1rem; }
  .card {
    display: flex; flex-direction: column; gap: .7rem;
    padding: 1.4rem;
    border-radius: 18px;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.09);
    text-decoration: none; color: var(--text);
    transition: transform .25s ease, border-color .25s ease, background .25s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .card:hover { transform: translateY(-4px); border-color: rgba(124,107,255,.6);
                background: rgba(255,255,255,.08); }
  .card .icon { font-size: 1.6rem; }
  .card h3 { font-size: 1.15rem; }
  .card p { color: var(--text-dim); font-size: .9rem; line-height: 1.55; }
  .card .go { margin-top: auto; font-size: .85rem; color: var(--accent-2); }

  footer { margin-top: 3rem; color: rgba(255,255,255,.35); font-size: .8rem;
           text-align: center; }
</style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <main class="wrap">
    <div class="logo">do-in-browsers</div>
    <p class="tagline">纯前端 · 零后端 · 工具集合。所有数据只在本地浏览器里处理，
      直接部署到 <b>GitHub Pages / Cloudflare</b> 即可使用。</p>

    <div class="section-title">工具</div>
    <div class="grid">
      <a class="card" href="music-viewer/index.html">
        <div class="icon">🎵</div>
        <h3>Music Viewer · 音乐可视播放器</h3>
        <p>上传音乐、封面与 LRC 歌词，生成「旋转唱片 + 自动滚词 + 随音频律动的极光背景」
          播放页，为录屏制作音乐视频量身打造。</p>
        <span class="go">打开 →</span>
      </a>
    </div>
  </main>

  <footer>纯静态 · 无构建 · 无网络请求</footer>
</body>
</html>
